name: Evaluate Expo SDK 58 security migration

on:
  push:
    branches:
      - fix/mobile-sdk58-security-evaluation
    paths:
      - .github/workflows/sdk58-security-evaluation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sdk58-security-evaluation
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade dependencies using Expo official migration procedure
        env:
          CI: "1"
        run: |
          npm ci
          npm install expo@^58.0.0 --save
          npx expo install --fix --npm
          npm ci
      - name: Collect real npm audit report without hiding failures
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/sdk58-audit.json"
          audit_code=$?
          set -e
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/sdk58-audit.json')); console.log('Audit counts:',JSON.stringify(j.metadata?.vulnerabilities));console.log('HIGH entries:',Object.entries(j.vulnerabilities||{}).filter(([k,v])=>['high','critical'].includes(v.severity)).map(([k])=>k));"
          echo "Audit return code: $audit_code"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk58-candidate-audit
          path: ${{ runner.temp }}/sdk58-audit.json
          if-no-files-found: warn
      - name: Commit generated manifest and npm lockfile ONLY to experimental branch
        shell: bash
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(mobile): evaluate Expo SDK 58 dependency upgrade'
            git push origin HEAD:fix/mobile-sdk58-security-evaluation
          fi
      - name: Validate SDK and app
        env:
          CI: "1"
        shell: bash
        run: |
          npx expo install --check
          npm run lint
          npm run typecheck
          npm run test:navigation-auth
          npm run test:shelly-mqtt-pairing
          npm run test:shelly-ble-rpc
          npx expo export --platform android --output-dir dist-sdk58
      - name: Remove write access from evaluation workflow once results are reviewed
        run: echo "This experimental workflow is not for production; delete before merging any SDK upgrade."
