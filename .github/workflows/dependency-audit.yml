name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"
  # Existing high-severity baseline tracked in issue #42.
  # Manual and weekly audits report risk without blocking unrelated PRs.

permissions:
  contents: read

jobs:
  production-dependencies:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check lockfile vulnerabilities
        run: npm audit --omit=dev --audit-level=high
