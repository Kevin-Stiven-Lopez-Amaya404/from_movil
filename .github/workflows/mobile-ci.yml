name: Mobile CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  validate:
    name: Lint, types and mobile config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test native mobile configuration
        run: npm run test:mobile-config

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
