name: Safe Lockfile Security Trial

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/safe-lockfile-trial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Establish baseline
        run: |
          cp package-lock.json "$RUNNER_TEMP/lock-before.json"
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-before.json" || true
      - name: Attempt non-forced lockfile-only fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund > "$RUNNER_TEMP/fix-output.log" 2>&1 || true
          tail -n 35 "$RUNNER_TEMP/fix-output.log"
      - name: Verify native versions and record exact lockfile patch
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/lock-before.json","utf8"));
          const after = JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          const protectedDeps = [
            "expo","expo-router","expo-updates","expo-dev-client","react-native",
            "@sfourdrinier/react-native-ble-plx","react-native-zeroconf",
            "react-native-reanimated","react-native-worklets"
          ];
          for (const name of protectedDeps) {
            const key = "node_modules/" + name;
            const oldVersion = before.packages[key]?.version;
            const newVersion = after.packages[key]?.version;
            if (oldVersion !== newVersion) throw new Error(
              "Cannot accept change to native/runtime dependency "+name+": "+oldVersion+" -> "+newVersion
            );
          }
          const patch={changed:{},deleted:[],other:{}};
          for(const [path,value] of Object.entries(after.packages)){
            if(JSON.stringify(value)!==JSON.stringify(before.packages[path]))patch.changed[path]=value;
          }
          for(const path of Object.keys(before.packages)){
            if(!(path in after.packages))patch.deleted.push(path);
          }
          for(const [key,value] of Object.entries(after)){
            if(key!=="packages" && JSON.stringify(value)!==JSON.stringify(before[key]))
              patch.other[key]=value;
          }
          console.log("Lockfile patch: "+Object.keys(patch.changed).length+" changed, "+patch.deleted.length+" removed.");
          const serialized=JSON.stringify(patch);
          for(let i=0;i<serialized.length;i+=3000)console.log("LOCKPATCH:"+Math.floor(i/3000)+" "+serialized.slice(i,i+3000));
          NODE
      - name: Verify lockfile installation
        run: npm ci
      - name: Verify lint and TypeScript
        run: |
          npm run lint
          npm run typecheck
      - name: Verify mobile suites
        run: |
          npm run test:mobile-config
          npm run test:navigation-auth
          npm run test:alerts
          npm run test:realtime-device-status
          npm run test:device-presentation
          npm run test:energy-sql034
          npm run test:shelly-mqtt-pairing
          npm run test:shelly-ble-rpc
          node scripts/profile-settings-actions.test.mjs
          node scripts/language-preferences.test.mjs
      - name: Verify Android JavaScript export
        run: npx expo export --platform android --output-dir dist-ci
      - name: Security delta after lockfile-only fix
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-after.json" || true
          node scripts/audit-regressions.mjs "$RUNNER_TEMP/audit-before.json" "$RUNNER_TEMP/audit-after.json"
          node -e 'const f=require("fs");for(const k of ["before","after"]){const j=JSON.parse(f.readFileSync(process.env.RUNNER_TEMP+"/audit-"+k+".json"));console.log(k+" severity counts: "+JSON.stringify(j.metadata?.vulnerabilities??{}))}'
      - name: Attach patch diff for human review
        if: always()
        run: git diff -- package-lock.json > "$RUNNER_TEMP/lockfile.patch"
      - name: Upload candidate diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-trial-diff
          path: ${{ runner.temp }}/lockfile.patch
          if-no-files-found: error
          retention-days: 7
